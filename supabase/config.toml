# Supabase config — M8 Stripe Edge Functions
# Generated for Smart Trader Assistant. See https://supabase.com/docs/guides/functions

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
port = 54325
file_size_limit = "50MiB"
image_transformation_enabled = true

[auth]
enabled = true
port = 54325
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://smart-tajir.com", "https://smart-trader-assistant.vercel.app"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false
enable_manual_linking = true
third_party_auth = { enabled = false }

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

# ── Edge Functions ───────────────────────────────────────────────────────
[functions.stripe-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/stripe-webhook/import_map.json"
entrypoint = "./functions/stripe-webhook/index.ts"

[functions.create-checkout-session]
enabled = true
verify_jwt = false
import_map = "./functions/create-checkout-session/import_map.json"
entrypoint = "./functions/create-checkout-session/index.ts"

[functions.create-portal-session]
enabled = true
verify_jwt = false
import_map = "./functions/create-portal-session/import_map.json"
entrypoint = "./functions/create-portal-session/index.ts"
